name: Deploy Firebase backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # يقرأ مفتاح حساب الخدمة من الـ secret ويطلع منه project_id تلقائياً
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes
        run: npx --yes firebase-tools@latest deploy --only firestore --project "${{ steps.auth.outputs.project_id }}" --non-interactive
